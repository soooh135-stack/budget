<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두 나라 가계부</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#F4EEEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170A0E" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} [hidden]{display:none!important} img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/nanumsquareround.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* One deliberate look (grey + candy blocks, after the Inkwell reference): single theme on purpose */
:root{
  color-scheme:light;
  --bg:#ADADAB; --surface:#FFFFFF; --surface2:#F1EFEA; --ink:#161616; --ink2:#3A3A3A; --muted:#77736C; --line:#E4E1DA;
  --yellow:#F6F47C; --beige:#D8D2C2; --sage:#BFDDB4; --lilac:#D9CCE8; --pink:#F4C6D9;
  --accent:#161616; --accent-ink:#FFFFFF;
  --bank:#5B5BD6; --cash:#D9A400; --exp:#161616; --good:#2E7D4F; --warn:#9A6A00; --bad:#C0392B;
  --radius:30px;
  --font:"Nunito","NanumSquareRound",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Nunito","NanumSquareRound",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-inline:12px;padding-block:14px 120px;position:relative;overflow:hidden}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:30px;font-weight:600;letter-spacing:-.03em}
h3{font-size:12px;font-weight:800;color:var(--ink);letter-spacing:.06em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.small{font-size:13px} .tiny{font-size:12px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
p{margin:0}
svg.sh{position:absolute;pointer-events:none;z-index:0}
.card>*:not(svg.sh),.panel>*:not(svg.sh){position:relative;z-index:1}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 0;position:relative;z-index:2}
.logo{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:800;border:0}
.logo i{width:16px;height:16px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:block}
.hbtns{display:flex;gap:6px;align-items:center}
.rbtn{height:42px;min-width:42px;padding:0 14px;border-radius:999px;background:#fff;border:0;font-size:13px;font-weight:800;display:inline-grid;place-items:center}
.sync{display:block;font-size:11px;color:#3d3d3b;text-align:right;margin:6px 6px 0;position:relative;z-index:2}

/* hero (shape stage) */
.hero{position:relative;height:230px;margin:0 -12px}
.hero .count{position:absolute;left:24px;bottom:18px;background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:800}
.hero .stick{position:absolute;right:20px;bottom:20px;background:var(--yellow);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:800;transform:rotate(-6deg);border:2px solid var(--ink)}
.hero .stick.neg{background:var(--pink)}
.stage{position:relative;height:96px;margin:0 -12px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:0 4px 2px;position:relative;z-index:2}
.pagehead h2{font-size:36px;font-weight:700;letter-spacing:-.04em;color:var(--ink)}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--yellow);border-radius:22px;padding:12px 16px;margin:10px 0 0;font-size:13px;position:relative;z-index:2;border:2px solid var(--ink)}

/* blocks */
.stack{display:flex;flex-direction:column;gap:8px}
.card,.panel{background:var(--surface);border-radius:var(--radius);padding:22px 20px;position:relative;overflow:hidden}
.c-y{background:var(--yellow)}.c-b,.panel{background:var(--beige)}.c-g{background:var(--sage)}.c-l{background:var(--lilac)}.c-p{background:var(--pink)}
.grid2{display:grid;grid-template-columns:1fr;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.T,.head h2{font-size:32px;font-weight:600;letter-spacing:-.035em;line-height:1.02}
.va{font-size:12px;font-weight:800;letter-spacing:.04em;white-space:nowrap;background:transparent;border:0;padding:0}

.who{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.badge{background:var(--yellow);border-radius:999px;padding:5px 12px;font-size:11px;font-weight:800;letter-spacing:.04em;border:1.5px solid var(--ink)}
.badge.neg{background:var(--pink)}
.big{font-size:64px;font-weight:600;letter-spacing:-.045em;line-height:.95;margin-top:14px}
.big small{font-size:26px;font-weight:700;margin-right:3px;letter-spacing:-.02em}
.sub{font-size:13.5px;margin-top:10px;line-height:1.55;color:var(--ink2)}
.sub b{font-weight:800}

.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag{border:1.5px solid var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;background:transparent;display:inline-block;margin:0;vertical-align:baseline}
.tag.f,.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;background:rgba(255,255,255,.55)}

.grid4{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;margin-top:6px}
.grid4 .n{font-size:38px;font-weight:600;letter-spacing:-.045em;line-height:1}
.grid4 .d{font-size:11.5px;color:var(--ink2);margin-top:6px;line-height:1.4}
.grid4 hr{border:0;border-top:2.5px solid var(--ink);border-radius:2px;width:22px;margin:12px 0 0}
.fxline{font-size:12px;color:var(--muted);margin-top:16px}
.fxline button{background:none;border:0;padding:0;font-weight:800;text-decoration:underline;font-size:12px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .card{min-height:196px;display:flex;flex-direction:column}
.row2 .T{font-size:28px}
.row2 .s{font-size:12px;color:var(--ink2);margin-top:6px}
.row2 .v{margin-top:auto;font-size:24px;font-weight:700;letter-spacing:-.03em}
.more{font-size:11px;font-weight:800;letter-spacing:.04em;margin-top:6px}

.wave{position:relative;height:104px;margin:2px 0}
.wave svg{position:absolute;inset:0;width:100%;height:100%}
.wave .in{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:14px;font-weight:700}
.wave .in b{font-weight:800;font-size:22px;letter-spacing:-.03em}
.wave .in small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-align:right}

/* goals */
.todo{display:flex;flex-direction:column}
.todo label{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 0;border-top:1.5px dashed #d6d3cb;cursor:pointer}
.todo label:first-child{border-top:0;padding-top:4px}
.todo input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);margin:0;display:grid;place-items:center;background:transparent;cursor:pointer}
.todo input:checked{background:var(--sage)}
.todo input:checked::after{content:"";width:7px;height:12px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.todo .t{font-weight:800;font-size:15px}
.todo .d{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.5}
.todo .done .t{text-decoration:line-through;opacity:.55}
.todo .tag{font-size:10.5px;padding:1px 8px;margin-left:6px;border-width:1.2px;vertical-align:2px}

/* charts */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--font);font-size:11px;font-weight:700}
.chart .grid{stroke:#E7E4DD;stroke-width:1}
.legend{display:flex;gap:6px;font-size:12px;color:var(--ink);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:4px 11px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 11px;border-radius:14px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:3}
.tip.on{opacity:1}

.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;font-size:13px;font-weight:600}
.hbar .track{height:14px;background:rgba(255,255,255,.7);border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;position:relative}
.card:not(.c-y):not(.c-g):not(.c-l):not(.c-b):not(.c-p) .hbar .track{background:var(--surface2)}
.hbar .fill{height:100%;background:var(--ink);border-radius:999px}
.hbar .fill.blue{background:var(--ink)}
.hbar .fill.over{background:var(--bad)}
.hbar .pace{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.hbar .meta{font-size:12px;color:var(--ink2);grid-column:2/4;margin-top:-6px;font-weight:500}

.bar{height:14px;background:var(--surface2);border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--yellow);border-right:1.5px solid var(--ink);border-radius:999px}

.ratio{display:grid;grid-template-columns:1fr;gap:16px}
.ratio>div{padding:0}
.ratio .k{font-size:12px;color:var(--ink2);font-weight:700}
.ratio .v{font-size:36px;font-weight:600;letter-spacing:-.045em;line-height:1.05}
.ratio .s{font-size:12px;color:var(--ink2)}
.ratio>div::after{content:"";display:block;width:22px;border-top:2.5px solid var(--ink);margin-top:10px}
.ratio.three{grid-template-columns:1fr 1fr}
.rings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ring{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:4px 0}
.ring svg{width:100%;max-width:104px;height:auto}
.ring .rv{font-size:24px;font-weight:800;letter-spacing:-.03em;fill:var(--ink)}
.ring .k{font-weight:800;font-size:13px}
.ring .s{font-size:11px;color:var(--ink2);line-height:1.35}
.state{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800}
.state.ok{color:var(--good)} .state.warn{color:var(--warn)} .state.bad{color:var(--bad)}
.bignum{font-size:56px;font-weight:600;letter-spacing:-.045em;line-height:1}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1.5px dashed #d6d3cb}
.li:first-child{border-top:0}
.li .nm{font-weight:700}
.li .meta{font-size:12px;color:var(--muted)}
.bank{font-size:11px;font-weight:800;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none;border:2px solid var(--ink)}

/* transactions */
.txl{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:40px 1fr auto;grid-template-areas:"d b amt" "d b cat";column-gap:10px;row-gap:4px;align-items:center;padding:12px 0;border-top:1.5px dashed #d6d3cb}
.tx:first-child{border-top:0}
.tx .d{grid-area:d;font-size:13px;font-weight:800;align-self:start;padding-top:2px}
.tx .b{grid-area:b;min-width:0;display:flex;flex-direction:column}
.tx .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.tx .amt{grid-area:amt;text-align:right;font-weight:800;white-space:nowrap}
.tx select{grid-area:cat;justify-self:end;min-height:28px;padding:2px 10px;font-size:12px;max-width:120px}

/* forms */
.tablewrap{overflow-x:auto;margin-inline:-20px;padding-inline:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
td{padding:9px 6px;border-bottom:1.5px dashed #d6d3cb;vertical-align:middle}
td.r,th.r{text-align:right}
td .desc{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
select,input[type=text],input[type=number],input[type=date],input[type=month]{background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:7px 14px;min-height:40px;max-width:100%;font-weight:600}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 16px;font-weight:800;font-size:14px}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost.danger{border-color:transparent}
.btn.sm{padding:5px 12px;font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink2)}
.drop{display:block;border:2px dashed var(--ink);border-radius:26px;padding:28px 16px;text-align:center;background:var(--yellow);cursor:pointer}
.drop.over{background:var(--sage)}
.steps{margin:0;padding-left:20px;color:var(--ink2);font-size:14px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;border:1.2px solid var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--pink);border-radius:18px;padding:8px 12px;font-size:13px;border:1.5px solid var(--ink)}
.back{align-self:flex-start;background:#fff;border:0}
details summary{cursor:pointer;font-weight:700}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* bottom nav: white pill, black active */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;border-radius:999px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
nav.tabs button{border:0;background:transparent;padding:12px 2px;border-radius:999px;color:#777;font-size:12.5px;font-weight:800}
nav.tabs button svg{display:none}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}

/* total assets */
.worth .who{margin-bottom:4px}
.tot{font-size:46px;font-weight:700;letter-spacing:-.045em;line-height:1.05;margin:6px 0 4px}
.compbar{display:flex;height:16px;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin:14px 0 10px}
.compbar i{display:block;min-width:4px}
.compbar i+i{border-left:1.5px solid var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border-radius:20px;padding:12px 14px;min-height:96px;display:flex;flex-direction:column}
.tile .tk{display:flex;justify-content:space-between;font-size:12px;font-weight:800}
.tile .tv{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-top:auto}
.tile .ts{font-size:11px;color:var(--ink2);line-height:1.35;margin-top:2px}
/* subscriptions */
.subs{display:flex;flex-direction:column}
.subrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1.5px dashed #d6d3cb}
.subrow:first-child{border-top:0}
.subrow .sn{font-weight:800;font-size:15px}
.subrow .sn .chip{margin-left:4px;vertical-align:2px}
.subrow .sv{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.subrow .sv b{font-size:16px;font-weight:800}
.subrow .sv .btn{padding:2px 0;font-size:11px;color:var(--muted)}
nav.tabs .in{grid-template-columns:repeat(5,1fr)}
nav.tabs button{font-size:12px;padding:12px 0}

.catlist{display:flex;flex-direction:column;margin-top:10px}
.catrow{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1.5px dashed rgba(22,22,22,.25);padding:12px 2px;font-size:15px;font-weight:700;text-align:left}
.catrow:first-child{border-top:0}
.catrow i,.hbtn i{font-style:normal;font-size:11px;margin-left:4px}
.catrow.on{color:var(--ink)}
.hbtn{background:none;border:0;padding:0;width:100%;text-align:left;font:inherit;color:inherit}
.detail{background:rgba(255,255,255,.72);border:1.5px solid var(--ink);border-radius:18px;padding:4px 12px;margin:4px 0 10px}
.drow{padding:10px 0;border-top:1.5px dashed #d6d3cb}
.drow:first-child{border-top:0}
.dmain{display:flex;gap:8px;align-items:baseline;min-width:0}
.dd{font-size:12px;font-weight:800;flex:none}
.ddesc{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dedit{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.dedit .tiny{flex:1;min-width:80px}
.dedit input.damt{width:104px;min-height:32px;padding:3px 10px;font-size:13px}
.dedit select{min-height:32px;padding:2px 10px;font-size:12.5px;max-width:130px}
.addform{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.72);border:1.5px solid var(--ink);border-radius:18px;padding:10px;margin-bottom:12px}

.chatlog{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;margin-bottom:10px}
.chatlog:empty{display:none}
.bubble{padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.55;max-width:92%;border:1.5px solid var(--ink)}
.bubble.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.bubble.assistant{align-self:flex-start;background:#fff;border-bottom-left-radius:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .tag{background:rgba(255,255,255,.6);font-size:12.5px}

.capcard .capnum{font-size:34px;font-weight:700;letter-spacing:-.04em;margin-top:6px}
.capcard .capnum span{font-size:16px;font-weight:700;color:var(--ink2)}
.capbar{position:relative;height:16px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;margin:10px 0 8px;overflow:visible}
.capbar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.capbar i.over{background:var(--bad)}
.capbar b{position:absolute;top:-5px;bottom:-5px;width:2.5px;background:var(--bad);border-radius:2px}
.capedit{margin-top:10px}
.capedit input{min-height:34px;padding:4px 12px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.quick .btn{background:#fff}
.quick .btn.primary{background:var(--ink)}
.capcard .addform{margin:10px 0 0}
.goalrow{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 0;border-top:1.5px dashed #d6d3cb;align-items:start}
.goalrow:first-child{border-top:0;padding-top:4px}
.goalrow input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);margin:0;display:grid;place-items:center;background:transparent;cursor:pointer}
.goalrow input:checked{background:var(--sage)}
.goalrow input:checked::after{content:"";width:7px;height:12px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}

const DICT_KEYS = Object.keys(DICT).sort((a, b) => b.length - a.length);
const HANGUL = /[가-힣]/;
function tr(s){
  if (lang !== 'en' || !s || !HANGUL.test(s)) return s;
  const t = s.trim(); if (DICT[t] != null) return s.replace(t, DICT[t]);
  let o = s;
  for (const k of DICT_KEYS) if (o.includes(k)) o = o.split(k).join(DICT[k]);
  return o.replace(/(\d+)개월/g, '$1 mo').replace(/(\d+)개 계좌/g, '$1 accounts').replace(/(\d+)개/g, '$1').replace(/(\d+)건/g, '$1').replace(/(\d+)주/g, 'W$1');
}
function translateDOM(root){
  if (lang !== 'en' || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes){
    if (!HANGUL.test(n.nodeValue)) continue;
    const p = n.parentNode; if (!p || p.nodeName === 'SCRIPT' || p.nodeName === 'STYLE') continue;
    if (p.closest && p.closest('.desc,.ddesc,.chatlog')) continue;   // bank descriptions & chat stay as written
    if (p.nodeName === 'OPTION' && !p.hasAttribute('value')) p.setAttribute('value', p.textContent);
    n.nodeValue = tr(n.nodeValue);
  }
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el => {
    for (const a of ['placeholder', 'aria-label']) if (el.hasAttribute(a)) el.setAttribute(a, tr(el.getAttribute(a)));
  });
}

/* ================= money helpers ================= */
function fmt(v, cur, o={}){
  const neg = v < 0, a = Math.abs(v); let s;
  if (cur === 'KRW'){
    if (o.compact && lang === 'en' && a >= 1e9) s = (a/1e9).toFixed(2).replace(/\.?0+$/,'') + 'B';
    else if (o.compact && lang === 'en' && a >= 1e6) s = (a/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
    else if (o.compact && lang === 'en' && a >= 1e4) s = Math.round(a/1e3).toLocaleString('en') + 'K';
    else if (o.compact && a >= 1e8) s = (a/1e8).toFixed(2).replace(/\.?0+$/,'') + '억';
    else if (o.compact && a >= 1e4) s = Math.round(a/1e4).toLocaleString('ko-KR') + '만';
    else s = Math.round(a).toLocaleString('ko-KR');
    s = '₩' + s;
  } else {
    if (o.compact && a >= 1e6) s = (a/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
    else if (o.compact && a >= 1e4) s = (a/1e3).toFixed(1).replace(/\.0$/,'') + 'k';
    else { const nc = o.noCents || o.compact; s = a.toLocaleString('en-AU', {minimumFractionDigits: nc ? 0 : 2, maximumFractionDigits: nc ? 0 : 2}); }
    s = (cur === 'USD' ? 'US$' : 'A$') + s;
  }
  return (neg ? '−' : (o.sign && v > 0 ? '+' : '')) + s;
}
const fm = (v, cur, o={}) => fmt(v, cur, Object.assign({noCents:true}, o));
const fc = (v, cur, o={}) => fmt(v, cur, Object.assign({compact:true}, o));
// everything converts through KRW: fx = KRW per AUD, fxUsd = KRW per USD
function conv(v, from, to){ if (from === to) return v; const k = {KRW: 1, AUD: S.settings.fx || 950, USD: S.settings.fxUsd || 1350}; return v * k[from] / k[to]; }
const pct = (a, b) => b ? a / b * 100 : null;

/* ================= derived data ================= */
const allTx = () => Object.values(S.months).flat();
const acctById = id => S.settings.accounts.find(a => a.id === id);
const descKey = d => String(d||'').replace(/value date.*|card xx\d+.*/i, '').toLowerCase().replace(/[0-9#*\-_/.:,()]+/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ');
function categorize(desc, amt, acctId){
  const key = descKey(desc), ov = S.settings.catOverrides || {};
  // the holder's own name, alone or after a bank name ("토스 홍길동"), means money between own accounts
  const who = String(desc || '').split(' · ')[0].trim().split(/\s+/);
  if ((S.settings.ownerNames || []).some(n => who.includes(n))) return '내 계좌 이체';
  if (key && ov[key] && CAT[ov[key]]) return ov[key];
  for (const [re, c] of RULES) if (re.test(desc)) return amt > 0 && (CAT[c] || {}).need === 'biz' ? '사업 수입' : c;
  const a = acctId ? acctById(acctId) : null;
  if (a && amt > 0 && a.defInc) return a.defInc;
  if (a && amt < 0 && a.defExp) return a.defExp;
  return amt > 0 ? '기타수입' : '기타지출';
}
function balancePoints(a){
  const pts = [];
  for (const t of allTx()) if (t.acct === a.id && typeof t.bal === 'number') pts.push({date:t.date, bal:t.bal, seq:t.seq||0});
  for (const s of a.snaps||[]) pts.push({date:s.date, bal:s.bal, seq:1e9});
  // accounts without a balance column (cash): running sum of their transactions on top of snapshots
  pts.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : x.seq - y.seq);
  return pts;
}
function hasBalances(a){ return allTx().some(t => t.acct === a.id && typeof t.bal === 'number'); }
function balanceAt(a, dateEnd){
  if (!hasBalances(a)){
    // running total: last snapshot before date + transactions after it
    const snaps = (a.snaps||[]).filter(s => s.date <= dateEnd).sort((x, y) => x.date < y.date ? -1 : 1);
    const base = snaps.length ? snaps[snaps.length-1] : null;
    let b = base ? base.bal : 0, any = !!base;
    for (const t of allTx()) if (t.acct === a.id && t.date <= dateEnd && (!base || t.date > base.date)){ b += t.amt; any = true; }
    return any ? b : null;
  }
  let b = null;
  for (const p of balancePoints(a)){ if (p.date <= dateEnd) b = p.bal; else break; }
  return b;
}
const currentBalance = a => balanceAt(a, '9999-12-31') ?? 0;
function lastUpdated(a){
  let d = null;
  for (const t of allTx()) if (t.acct === a.id && (!d || t.date > d)) d = t.date;
  for (const s of a.snaps||[]) if (!d || s.date > d) d = s.date;
  return d;
}
function monthsWithData(){
  const ms = new Set(allTx().map(t => monthOf(t.date)));
  for (const a of S.settings.accounts) for (const s of a.snaps||[]) ms.add(monthOf(s.date));
  return [...ms].sort();
}
// the month the app treats as "이번 달": current month if it has data, else the latest month that does
function focusMonth(){ const ms = monthsWithData(); const cm = thisMonth(); return ms.includes(cm) || !ms.length ? cm : ms[ms.length-1]; }

// flow for a month. mode: 'AUD' | 'KRW' (that currency's accounts only) | 'ALL-AUD' | 'ALL-KRW'
function flow(m, mode){
  const cur = mode.length === 3 ? mode : mode.slice(4);
  const f = {cur, inc:0, incBank:0, incCash:0, exp:0, biz:0, inv:0, cats:{}, incCats:{}, n:0};
  for (const t of S.months[m] || []){
    const a = acctById(t.acct); if (!a) continue;
    if (mode.length === 3 && a.cur !== mode) continue;
    const kind = (CAT[t.cat] || {}).k || (t.amt > 0 ? 'income' : 'expense');
    const v = conv(t.amt, a.cur, cur);
    if (kind === 'income'){ f.inc += v; if (a.type === 'cash' || t.cat === '현금 수입') f.incCash += v; else f.incBank += v; f.incCats[t.cat] = (f.incCats[t.cat]||0) + v; }
    else if (kind === 'expense'){ f.exp -= v; f.cats[t.cat] = (f.cats[t.cat]||0) - v; f.n++; if ((CAT[t.cat] || {}).need === 'biz') f.biz -= v; }
    else if (kind === 'invest') f.inv -= v;
  }
  return f;
}
function avgFlow(endMonth, n, mode){
  // average of the n full months before endMonth that have data
  const ms = monthsWithData().filter(m => m < endMonth).slice(-n);
  if (!ms.length) return null;
  const fs = ms.map(m => flow(m, mode));
  const avg = {inc:0, exp:0, biz:0, inv:0, cats:{}, months: ms.length};
  for (const f of fs){ avg.inc += f.inc/fs.length; avg.exp += f.exp/fs.length; avg.biz += f.biz/fs.length; avg.inv += f.inv/fs.length; for (const c in f.cats) avg.cats[c] = (avg.cats[c]||0) + f.cats[c]/fs.length; }
  return avg;
}
function holdings(cur){
  const h = {bank:0, saving:0, cash:0, ewallet:0, stock:0, invest:0, total:0, aud:0, krw:0, usd:0};
  for (const a of S.settings.accounts){
    const b = currentBalance(a);
    if (a.cur === 'AUD') h.aud += b; else if (a.cur === 'USD') h.usd += b; else h.krw += b;
    const v = conv(b, a.cur, cur);
    h[a.type] = (h[a.type]||0) + v; h.total += v;
  }
  return h;
}
function worthSeries(cur, n=12){
  const ms = monthsWithData().slice(-n);
  return ms.map(m => {
    const end = m === thisMonth() ? today() : monthEnd(m);
    let v = 0; for (const a of S.settings.accounts){ let b = balanceAt(a, end); if (b == null && !allTx().some(t => t.acct === a.id) && (a.snaps || []).length) b = [...a.snaps].sort((x, y) => x.date < y.date ? -1 : 1)[0].bal; if (b != null) v += conv(b, a.cur, cur); }
    return {m, v};
  });
}
// recurring charges: same merchant, expense, in >= 2 of the last 3 months, amounts within 20%
function subscriptions(cur){
  const ms = monthsWithData().slice(-3); const by = {};
  for (const m of ms) for (const t of S.months[m] || []){
    if (t.amt >= 0 || !FIXED_CATS.includes(t.cat)) continue;
    const k = descKey(t.desc); if (!k) continue;
    (by[k] ??= {desc:t.desc, cat:t.cat, months:new Set(), amts:[], acct:t.acct}).months.add(m); by[k].amts.push(-t.amt);
  }
  const out = [];
  for (const k in by){ const r = by[k]; if (r.months.size < 2) continue;
    const lo = Math.min(...r.amts), hi = Math.max(...r.amts); if (hi > lo * 1.2) continue;
    if (r.amts.length > r.months.size * 2) continue; // frequent shops, not subscriptions
    const a = acctById(r.acct); out.push({desc:r.desc, cat:r.cat, monthly: conv(hi, a ? a.cur : 'AUD', cur)}); }
  return out.sort((a, b) => b.monthly - a.monthly);
}

// Every subscription in the history: known services, anything categorised 구독, and very regular charges.
function subsAll(cur){
  const groups = {};
  for (const t of allTx()){
    if (t.amt >= 0) continue; const kind = (CAT[t.cat] || {}).k; if (kind !== 'expense') continue;
    const a = acctById(t.acct); if (!a) continue;
    let name = null, tag = null;
    for (const [re, n, k] of SUB_KNOWN) if (re.test(t.desc)){ name = n; tag = k; break; }
    const key = name || descKey(t.desc); if (!key) continue;
    (groups[key] ??= {name, tag, key, desc: t.desc, cats: new Set(), tx: []});
    groups[key].cats.add(t.cat); groups[key].tx.push({date: t.date, v: conv(-t.amt, a.cur, cur)});
  }
  const now = today(), daysAgo = d => (new Date(now) - new Date(d)) / 864e5;
  const out = [];
  for (const g of Object.values(groups)){
    const tx = g.tx.sort((x, y) => x.date < y.date ? -1 : 1), months = new Set(tx.map(x => x.date.slice(0, 7)));
    const vals = tx.map(x => x.v).sort((x, y) => x - y), med = vals[vals.length >> 1];
    const stable = vals.filter(v => Math.abs(v - med) <= med * .1).length / vals.length;
    const auto = !g.name && !g.cats.has('구독') && months.size >= 4 && stable >= .9 && tx.length <= months.size + 1
      && ![...g.cats].some(c => ['세금·수수료', '주거·공과금', '생활비', '음식', '교통', '쇼핑'].includes(c)) && med < conv(300, 'AUD', cur);
    if (!g.name && !g.cats.has('구독') && !auto) continue;
    const last = tx[tx.length - 1].date, span = Math.max(1, monthsBetween(tx[0].date.slice(0, 7), last.slice(0, 7)) + 1);
    const yearly = tx.length <= Math.ceil(span / 10) && med >= conv(60, 'AUD', cur);
    const recent = tx.filter(x => daysAgo(x.date) <= 92).reduce((s, x) => s + x.v, 0);
    const monthly = yearly ? med / 12 : (recent > 0 ? recent / 3 : med * Math.min(2, tx.length / span));
    const active = daysAgo(last) <= (yearly ? 380 : 45);
    const name = g.name || g.desc.replace(/value date.*|card xx\d+.*|\b[A-Z]{2,3} \d[\d.,]*$/i, '').replace(/^(sq|dbs|smp|paypal|pp)\s*\*\s*/i, '').trim().slice(0, 26);
    out.push({key: g.key, name, tag: g.tag || (g.cats.has('구독') ? '구독' : '자동 감지'), monthly, yearly, active, last, first: tx[0].date, months: months.size, total: tx.reduce((s, x) => s + x.v, 0), n: tx.length});
  }
  const hidden = S.settings.subsHidden || {};
  return out.map(s => Object.assign(s, {hidden: !!hidden[s.key]})).sort((a, b) => b.monthly - a.monthly);
}

  return v.length % 2 ? v[v.length >> 1] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;

const saveTimers = {};
function persist(id){
  if (demo || !store) return;
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(async () => {
    const data = id === 'settings' ? S.settings : {items: S.months[id.slice(3)] || []};
    try { await store.save(id, data); setSync('저장됨'); }
    catch (e){ setSync(e && e.code === 'quota_exceeded' ? '저장 공간이 가득 찼어요' : '저장 실패 · 잠시 후 다시 해 주세요'); }
  }, 400);
}
const persistMonth = m => persist('tx-' + m);
const setSync = t => { $('#sync').textContent = t; };

async function initStore(){
  let db = null, user = null;
  try { if (window.claude && claude.use) [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch {}
  const id = user ? await user.id() : null;
  if (db && id){
    const col = db.collection('data/users/' + id);
    store = {save: (d, data) => col.doc(d).set(data)};
    let loaded = false;
    const timer = setTimeout(() => { if (!loaded) setSync('아직 연결 중이에요…'); }, 10000);
    col.onSnapshot(snap => {
      if (!snap.metadata.fromCache){ loaded = true; clearTimeout(timer); }
      const months = {}; let settings = null;
      for (const d of snap.docs){
        const v = d.data();
        if (d.id === 'settings') settings = JSON.parse(JSON.stringify(v));
        else if (d.id.startsWith('tx-')) months[d.id.slice(3)] = JSON.parse(JSON.stringify(v.items || []));
      }
      applyLoaded(settings, months);
      setSync(snap.metadata.fromCache ? '저장된 사본 표시 중' : '동기화됨 · 내 계정에만 저장');
    }, () => { clearTimeout(timer); setSync('연결이 끊겼어요. 페이지를 다시 열어 주세요.'); });
  } else {
    store = {save: async (d, data) => { const all = JSON.parse(lsGet('ntk') || '{}'); all[d] = data; lsSet('ntk', JSON.stringify(all)); }};
    const all = JSON.parse(lsGet('ntk') || '{}'); const months = {};
    for (const k in all) if (k.startsWith('tx-')) months[k.slice(3)] = all[k].items || [];
    applyLoaded(all.settings || null, months);
    setSync('이 기기에만 저장 중');
  }
}

let lastLoaded = '';

  if (!settings && !Object.values(months).some(a => a.length)){ if (!demo) loadDemo(); render(); return; }

function lineChart(series, cur, opt={}){
  if (series.length < 2) return `<p class="muted small">두 달 이상 쌓이면 추이가 보여요.</p>`;
  const W = 640, H = opt.h || 190, L = 6, R = 6, T = 16, B = 24;
  const vals = series.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (opt.zero) lo = Math.min(0, lo);
  const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.1 || 1; if (!opt.zero) lo -= pad; hi += pad;
  const x = i => L + (W - L - R) * i / (series.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const pts = series.map((p, i) => [x(i), y(p.v)]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = path + ` L${x(series.length-1)} ${H-B} L${x(0)} ${H-B} Z`;
  const ticks = [lo + (hi-lo)*0.33, lo + (hi-lo)*0.8];
  const last = pts[pts.length-1], cw = (W-L-R)/(series.length-1);
  const step = Math.ceil(series.length/6);
  const gid = 'g' + uid();
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'추이')}">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F6F47C" stop-opacity=".95"/><stop offset="1" stop-color="#F6F47C" stop-opacity=".15"/></linearGradient></defs>
    ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L}" y="${y(t)-4}">${fc(t, cur)}</text>`).join('')}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#F6F47C" stroke="var(--ink)" stroke-width="2.5"/>
    ${series.map((p, i) => (i % step === 0 || i === series.length-1) && !(i !== series.length-1 && series.length-1-i < step/2) ? `<text x="${x(i)}" y="${H-5}" text-anchor="${i === 0 ? 'start' : i === series.length-1 ? 'end' : 'middle'}">${esc(p.label || monthLabel(p.m))}</text>` : '').join('')}
    ${series.map((p, i) => `<rect x="${x(i) - cw/2}" y="0" width="${cw}" height="${H}" fill="transparent" data-tip="${esc(p.label || monthFull(p.m))}|${esc(fm(p.v, cur))}" data-cx="${x(i)/W}" data-cy="${y(p.v)/H}"/>`).join('')}
  </svg><div class="tip"></div></div>`;
}
// stacked income bars: 계좌 (bottom) + 현금 (top)
function incomeChart(ms, mode){
  const cur = mode.length === 3 ? mode : mode.slice(4);

  if (!fs.some(f => f.inc > 0)) return `<p class="muted small">아직 수입 기록이 없어요.</p>`;
  const W = 400, H = 200, L = 6, R = 6, T = 16, B = 24;
  const hi = Math.max(1, ...fs.map(f => f.inc)) * 1.12;
  const gw = (W-L-R)/fs.length, bw = Math.min(30, gw*0.55);
  const y = v => T + (H-T-B) * (1 - v/hi);
  const seg = (x0, v0, v1, color, top) => { const y0 = y(v0), y1 = y(v1); const h = y0 - y1; if (h <= 0.5) return '';
    const r = top ? Math.min(4, h, bw/2) : 0;
    return `<path d="M${x0} ${y0} V${y1+r} Q${x0} ${y1} ${x0+r} ${y1} H${x0+bw-r} Q${x0+bw} ${y1} ${x0+bw} ${y1+r} V${y0} Z" fill="${color}"/>`; };
  const tick = hi/1.12/2;

    <line class="grid" x1="${L}" x2="${W-R}" y1="${y(tick)}" y2="${y(tick)}"/><text x="${L}" y="${y(tick)-4}">${fc(tick, cur)}</text>
    <line class="grid" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    ${fs.map((f, i) => { const cx = L + gw*i + gw/2, x0 = cx - bw/2; const b = Math.max(0, f.incBank), c = Math.max(0, f.incCash);
      return seg(x0, 0, b, 'var(--bank)', c <= 0) + (c > 0 ? seg(x0, b + (b > 0 ? hi*0.008 : 0), b + c, 'var(--cash)', true) : '') +
        `<text x="${cx}" y="${H-5}" text-anchor="middle">${monthLabel(f.m)}</text>` +
        `<rect x="${cx-gw/2}" y="0" width="${gw}" height="${H}" fill="transparent" data-tip="${esc(monthFull(f.m))}|계좌 ${esc(fm(b, cur))}|현금 ${esc(fm(c, cur))}|합계 ${esc(fm(f.inc, cur))}" data-cx="${cx/W}" data-cy="${y(f.inc)/H}"/>`; }).join('')}
  </svg><div class="tip"></div></div>`;
}
function wireTips(root){

    const tip = ch.querySelector('.tip'); if (!tip) return;

  else if (kind === 'smiley') g = `<path fill="#fff" stroke="${ink}" stroke-width="3" d="M50 6 C62 6 64 20 76 22 C88 24 96 34 92 46 C88 56 96 66 88 76 C80 86 66 80 58 88 C50 96 38 94 32 84 C26 74 12 76 8 64 C4 52 14 44 12 32 C10 20 22 12 34 14 C42 16 42 6 50 6Z"/><circle cx="40" cy="46" r="4" fill="${ink}"/><circle cx="60" cy="46" r="4" fill="${ink}"/><path d="M40 60 Q50 68 60 60" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`;

// income of one month split into weeks (1-7, 8-14, 15-21, 22-28, 29-end), stacked 계좌 + 현금
function weekChart(m, mode){
  const cur = mode.length === 3 ? mode : mode.slice(4), dim = daysIn(m);
  const wk = [[1,7],[8,14],[15,21],[22,28]].concat(dim > 28 ? [[29, dim]] : []).map(([a, b]) => ({a, b, bank:0, cash:0}));
  for (const t of monthTx(m, mode, 'income')){ const a = acctById(t.acct), d = +t.date.slice(8), w = wk.find(x => d >= x.a && d <= x.b); if (!w) continue;
    const v = conv(t.amt, a.cur, cur); if (a.type === 'cash' || t.cat === '현금 수입') w.cash += v; else w.bank += v; }
  if (!wk.some(w => w.bank + w.cash > 0)) return '<p class="small ink2">이 달엔 수입 기록이 없어요.</p>';
  const W = 400, H = 190, L = 6, R = 6, T = 22, B = 24, hi = Math.max(1, ...wk.map(w => w.bank + w.cash)) * 1.15;
  const gw = (W-L-R)/wk.length, bw = Math.min(42, gw*.6), y = v => T + (H-T-B)*(1 - v/hi);
  const seg = (x0, v0, v1, color, top) => { const y0 = y(v0), y1 = y(v1), hh = y0 - y1; if (hh <= .5) return ''; const r = top ? Math.min(6, hh, bw/2) : 0;
    return `<path d="M${x0} ${y0} V${y1+r} Q${x0} ${y1} ${x0+r} ${y1} H${x0+bw-r} Q${x0+bw} ${y1} ${x0+bw} ${y1+r} V${y0} Z" fill="${color}" stroke="#161616" stroke-width="1.5"/>`; };
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="주별 수입">
    <line class="grid" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    ${wk.map((w, i) => { const cx = L + gw*i + gw/2, x0 = cx - bw/2, tot = w.bank + w.cash;
      return seg(x0, 0, w.bank, 'var(--bank)', w.cash <= 0) + (w.cash > 0 ? seg(x0, w.bank, tot, 'var(--cash)', true) : '') +
        (tot > 0 ? `<text x="${cx}" y="${y(tot) - 6}" text-anchor="middle" style="fill:var(--ink)">${fc(tot, cur)}</text>` : '') +
        `<text x="${cx}" y="${H-6}" text-anchor="middle">${i+1}주</text>` +
        `<rect x="${cx-gw/2}" y="0" width="${gw}" height="${H}" fill="transparent" data-tip="${+m.slice(5)}/${w.a}–${+m.slice(5)}/${w.b}|계좌 ${esc(fm(w.bank, cur))}|현금 ${esc(fm(w.cash, cur))}" data-cx="${cx/W}" data-cy="${y(tot)/H}"/>`; }).join('')}
  </svg><div class="tip"></div></div>`;
}

  // business costs come off the top: 50/30/20 is about the money left for your own life
  const inc = (f.inc > 0 ? f.inc : (avg ? avg.inc : 0)) - f.biz;
  const saved = inc - (f.exp - f.biz);
  const r = v => inc > 0 ? v / inc * 100 : null;
  const st = (v, lim, higherBetter) => v == null ? '' : (higherBetter ? v >= lim : v <= lim) ? `<span class="state ok">● 좋아요</span>` : (higherBetter ? v >= lim*0.6 : v <= lim*1.25) ? `<span class="state warn">▲ 조금 넘었어요</span>` : `<span class="state bad">■ 많이 벗어났어요</span>`;
  const budgets = S.settings.budgets || {};
  const bcats = EXP_CATS.filter(c => budgets[c] > 0 || (f.cats[c] || 0) > 0);
  const subs = subscriptions(cur);
  const fixed = subs.reduce((s, x) => s + x.monthly, 0);
  return `<div class="stack">
    ${stage('budget')}<div class="pagehead"><h2>${monthLong(m)} 진단</h2>${curSeg('budgetCur', cur, [['AUD','AUD'],['KRW','원화']])}</div>
    <section class="card c-l">${SH('star',{c:'#F6F47C',r:16,t:16,s:52})}
      <div class="head"><h2>지출 속도</h2><span class="tiny muted">${isNow ? `${dim}일 중 ${day}일 지남` : '마감된 달'}</span></div>
      <div class="ratio">
        <div><span class="k">지금까지 쓴 돈</span><div class="v num">${fm(f.exp, cur)}</div><span class="s">하루 평균 ${fm(f.exp/Math.max(1, day), cur)}</span></div>

      </div>
    </section>
    <section class="card ">${SH('flower',{c:'#F4C6D9',r:-40,t:-40,s:150,n:5})}
      <div class="head"><h2>50 / 30 / 20 점검</h2><span class="tiny muted">소득을 필수 50%, 선택 30%, 저축 20%로 나누는 기본 규칙</span></div>
      <div class="rings">

      </div>

    </section>
    <section class="card c-y">${SH('dashring',{r:-34,t:-34,s:104})}

    </section>
  </div>`;
}

function ring(label, v, target, sub, state){
  const R = 46, C = 2 * Math.PI * R, val = v == null ? 0 : Math.max(0, Math.min(100, v));
  const tAng = target / 100 * 2 * Math.PI - Math.PI / 2;
  return `<div class="ring"><svg viewBox="0 0 116 116" role="img" aria-label="${esc(label)} ${v == null ? '없음' : v.toFixed(0) + '%'}">
    <circle cx="58" cy="58" r="${R}" fill="none" stroke="#ECE9E2" stroke-width="12"/>
    <circle cx="58" cy="58" r="${R}" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C * val / 100} ${C}" ${val <= 0 ? 'visibility="hidden"' : ''} transform="rotate(-90 58 58)"/>
    <line x1="${58 + (R-8) * Math.cos(tAng)}" y1="${58 + (R-8) * Math.sin(tAng)}" x2="${58 + (R+8) * Math.cos(tAng)}" y2="${58 + (R+8) * Math.sin(tAng)}" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
    <text x="58" y="66" text-anchor="middle" class="rv">${v == null ? '—' : Math.round(v) + '%'}</text></svg>
    <span class="k">${esc(label)}</span><span class="s">${sub}</span>${state}</div>`;
}

/* ================= TAB: 구독 ================= */
function viewSubs(){
  const cur = homeCur, all = subsAll(cur);
  const act = all.filter(s => s.active && !s.hidden), gone = all.filter(s => !s.active && !s.hidden), hid = all.filter(s => s.hidden);
  const month = act.reduce((s, x) => s + x.monthly, 0);
  const byTag = {}; for (const s of act) byTag[s.tag] = (byTag[s.tag] || 0) + s.monthly;
  const topTag = Object.entries(byTag).sort((a, b) => b[1] - a[1])[0];
  const ai = act.filter(s => s.tag === 'AI');
  const tips = [];
  if (ai.length >= 2) tips.push(L(`AI 구독이 ${ai.length}개(${ai.map(s => esc(s.name)).join(', ')})예요. 하나만 남기면 1년에 ${fm(Math.min(...ai.map(s => s.monthly)) * 12, cur)} 아껴요.`, `You pay for ${ai.length} AI tools (${ai.map(s => esc(s.name)).join(', ')}). Keeping one saves ${fm(Math.min(...ai.map(s => s.monthly)) * 12, cur)} a year.`));
  const gym = all.filter(s => s.tag === '헬스장');

function viewPlan(){
  const cur = planCur, mode = 'ALL-' + cur, m = focusMonth();
  const h = holdings(cur), avg = avgFlow(addMonths(m, 1), 6, mode);
  const ws = worthSeries(cur);
  const growth = ws.length >= 2 ? ws[ws.length-1].v - ws[0].v : 0;
  const perMonth = ws.length >= 2 ? growth / (ws.length - 1) : 0;
  const liquid = h.bank + h.saving + h.cash + h.ewallet;
  const efMonths = avg && avg.exp > 0 ? liquid / avg.exp : null;
  const comp = [['입출금', h.bank], ['예적금', h.saving], ['현금', h.cash], ['PayPal', h.ewallet], ['주식', h.stock], ['기타 투자', h.invest]];
  const maxComp = Math.max(1, ...comp.map(c => c[1]));
  const c = S.settings.calc; const monthly = c.monthly != null ? c.monthly : Math.max(0, Math.round(avg ? (avg.inc - avg.exp) : 0));
  const sim = simulate(h.stock + h.invest, monthly, c.rate, c.years);
  const contrib = h.stock + h.invest + monthly * 12 * c.years;
  return `<div class="stack">
    ${stage('plan')}<div class="pagehead"><h2>자산 계획</h2>${curSeg('planCur', cur, [['AUD','AUD'],['KRW','원화']])}</div>
    <section class="card ">${SH('asterisk',{r:20,t:22,s:40})}
      <div class="head"><h2>순자산 추이</h2><span class="small">${ws.length >= 2 ? `<span class="num ${growth >= 0 ? 'pos' : 'neg'}">${fm(growth, cur, {sign:true})}</span> <span class="muted">· ${ws.length-1}개월 동안 · 한 달 평균 <span class="num">${fm(perMonth, cur, {sign:true})}</span></span>` : ''}</span></div>
      ${lineChart(ws, cur, {label:'순자산 추이'})}
    </section>
    <div class="grid2">
      <section class="card c-g">${SH('smiley',{r:16,t:16,s:64})}
        <div class="head"><h2>비상금 체력</h2>${efMonths == null ? '' : efMonths >= 6 ? '<span class="state ok">● 든든해요</span>' : efMonths >= 3 ? '<span class="state ok">● 괜찮아요</span>' : efMonths >= 1 ? '<span class="state warn">▲ 더 모아요</span>' : '<span class="state bad">■ 부족해요</span>'}</div>
        <div class="bignum">${efMonths == null ? '—' : efMonths.toFixed(1) + '개월'}</div>
        <p class="small ink2" style="margin-top:4px">수입이 끊겨도 지금 바로 쓸 수 있는 돈(${fm(liquid, cur)})으로 버틸 수 있는 기간이에요. 학생·사회초년생은 3개월, 직장인은 6개월이 기본이에요.</p>
        ${efMonths != null && efMonths < 3 ? `<p class="small" style="margin-top:8px">3개월치까지 <b class="num">${fm(avg.exp*3 - liquid, cur)}</b> 남았어요.</p>` : ''}
      </section>
      <section class="card c-l">${SH('sparkle',{c:'#fff',r:-14,t:-14,s:86})}
        <div class="head"><h2>재산 구성</h2><span class="tiny muted">총 ${fm(h.total, cur)}</span></div>
        <div class="hbars">${comp.map(([k, v]) => `<div class="hbar"><span>${k}</span><div class="track"><div class="fill blue" style="width:${Math.max(0, v)/maxComp*100}%"></div></div><span class="num small">${h.total > 0 ? Math.round(v/h.total*100) : 0}%</span></div>`).join('')}</div>
        <p class="tiny muted" style="margin-top:10px">${h.cash + h.bank > h.total * 0.6 && h.total > 0 ? '재산 대부분이 입출금·현금에 있어요. 비상금을 뺀 나머지는 이자 높은 예적금이나 투자로 옮기는 걸 고려해 보세요.' : '입출금은 비상금만큼, 나머지는 예적금·투자로 나누는 게 기본이에요.'}</p>
      </section>
    </div>
    <section class="card ">${SH('flower',{c:'#F4C6D9',r:-40,t:-40,s:150,n:5})}
      <div class="head"><h2>저축 목표</h2><span class="tiny muted">기한까지 매달 얼마씩 모아야 하는지 계산해요</span></div>
      <div class="list">${S.settings.goals.map(g => { const a = g.acct ? acctById(g.acct) : null;
        const sv = a ? conv(currentBalance(a), a.cur, g.cur) : (g.saved || 0); const p = Math.max(0, Math.min(100, sv / g.target * 100));
        const left = g.due ? Math.max(1, monthsBetween(thisMonth(), g.due)) : null; const need = left ? Math.max(0, (g.target - sv) / left) : null;
        return `<div class="li" style="grid-template-columns:1fr"><div class="row between"><span class="nm">${esc(g.name)}</span><span class="num small">${p.toFixed(0)}%</span></div>
          <div class="bar"><i style="width:${p}%"></i></div>
          <div class="row between tiny muted"><span class="num">${fm(sv, g.cur)} / ${fm(g.target, g.cur)}</span><span>${g.due ? `${g.due.replace('-', '년 ')}월까지 · 매달 <b class="num">${fm(need, g.cur)}</b>` : ''}</span></div>
          <div class="row"><span class="tiny muted">${a ? esc(a.name) + ' 잔액과 연동' : '직접 입력'}</span>${a ? '' : `<input type="number" id="gs-${g.id}" placeholder="모은 금액" value="${g.saved || ''}" style="width:130px;min-height:30px"><button class="btn sm" data-goalsave="${g.id}">저장</button>`}<button class="btn sm ghost danger" data-goaldel="${g.id}">삭제</button></div></div>`; }).join('') || '<p class="muted small">아직 목표가 없어요.</p>'}</div>
      <form id="addGoal" class="row" style="margin-top:12px">
        <input type="text" id="ngName" placeholder="목표 이름 (예: 비상금)" required style="flex:1;min-width:140px">
        <select id="ngCur" aria-label="통화"><option>AUD</option><option>KRW</option></select>
        <input type="number" id="ngTarget" placeholder="목표 금액" required min="1" style="width:130px">
        <input type="month" id="ngDue" aria-label="기한" style="min-height:36px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--surface)">
        <select id="ngAcct" aria-label="연동 계좌"><option value="">직접 입력</option>${S.settings.accounts.map(a => `<option value="${a.id}">${esc(a.name)} 잔액</option>`).join('')}</select>
        <button class="btn primary">추가</button>
      </form>
    </section>
    <section class="card c-y">${SH('star',{c:'#fff',r:16,t:16,s:52})}
      <div class="head"><h2>복리 계산기</h2><span class="tiny muted">지금 투자 재산 ${fm(h.stock + h.invest, cur)}에서 시작</span></div>
      <form id="calcForm" class="row">
        <label class="f">매달 투자<input type="number" id="cMonthly" value="${monthly}" min="0" step="any" style="width:130px"></label>
        <label class="f">연 수익률 (%)<input type="number" id="cRate" value="${c.rate}" step="0.5" style="width:100px"></label>
        <label class="f">기간 (년)<input type="number" id="cYears" value="${c.years}" min="1" max="50" style="width:90px"></label>
        <button class="btn" style="align-self:flex-end">계산</button>
      </form>
      <div class="ratio" style="margin-top:14px">
        <div><span class="k">${c.years}년 뒤</span><div class="v num">${fc(sim[sim.length-1].v, cur)}</div></div>
        <div><span class="k">내가 넣은 돈</span><div class="v num">${fc(contrib, cur)}</div></div>
        <div><span class="k">불어난 돈</span><div class="v num pos">${fc(sim[sim.length-1].v - contrib, cur)}</div></div>
      </div>
      ${lineChart(sim, cur, {label:'복리 시뮬레이션', zero:true, h:170})}
      <p class="tiny muted" style="margin-top:6px">기본값은 최근 6개월 평균 남은 돈이에요. 수익률은 보장되지 않아요. 미국·호주 지수 ETF의 장기 평균은 대략 연 7~10% 정도였어요.</p>
    </section>
  </div>`;
}
function monthsBetween(a, b){ const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); }
function simulate(start, monthly, rate, years){
  const r = rate / 100 / 12; let v = start; const out = [{label:'지금', v}];
  for (let y = 1; y <= years; y++){ for (let i = 0; i < 12; i++) v = v * (1 + r) + monthly; out.push({label: y + '년', v}); }
  return out;
}

// The site can carry the owner's data as an AES-GCM blob (key = PBKDF2 of a passphrase only the owner has).
let encAvailable = false, encSavedAt = '';
async function probeEnc(){
  if (!STANDALONE) return;
  try { const r = await fetch('data.enc', {cache: 'no-store'}); encAvailable = r.ok; if (r.ok){ const e = await r.json(); encSavedAt = e.savedAt || ''; } } catch { encAvailable = false; }

// Combine Claude's upload (base) with what was done on this device (local): local additions, edits,
// deletions, balance records and personal settings survive an update.
function mergeData(base, local){
  const out = {settings: JSON.parse(JSON.stringify(base.settings || {})), months: JSON.parse(JSON.stringify(base.months || {}))};
  const ls = local.settings || {}, os = out.settings;
  const deleted = new Set([...(ls.deletedTx || []), ...(os.deletedTx || [])]);
  const byId = {}; for (const m in out.months) for (const t of out.months[m]) byId[t.id] = t;
  for (const m in local.months || {}) for (const t of local.months[m]){
    if (deleted.has(t.id)) continue;
    const b = byId[t.id];
    if (!b){ if (t.manual) (out.months[m] ??= []).push(t); continue; }      // added on this device
    if (t.userCat) { b.cat = t.cat; b.userCat = true; }                     // edited on this device
    if (t.userAmt) { b.amt = t.amt; b.userAmt = true; }
  }
  for (const m in out.months) out.months[m] = out.months[m].filter(t => !deleted.has(t.id));
  // accounts: keep local-only accounts; merge balance records by date (this device wins on the same day)
  const accById = Object.fromEntries((os.accounts || []).map(a => [a.id, a]));
  for (const a of ls.accounts || []){
    const b = accById[a.id];
    if (!b){ (os.accounts ||= []).push(a); continue; }
    const snaps = {}; for (const s of b.snaps || []) snaps[s.date] = s; for (const s of a.snaps || []) snaps[s.date] = s;
    b.snaps = Object.values(snaps).sort((x, y) => x.date < y.date ? -1 : 1);
    if (a.defInc) b.defInc = a.defInc; if (a.defExp) b.defExp = a.defExp;
  }
  // personal settings made on the phone
  for (const k of ['spendCap', 'budgets', 'todoDone', 'subsHidden', 'calc', 'budgetCur']) if (ls[k] != null && (typeof ls[k] !== 'object' || Object.keys(ls[k]).length)) os[k] = ls[k];
  if ((ls.goals || []).length) os.goals = ls.goals;
  os.catOverrides = Object.assign({}, os.catOverrides, ls.catOverrides);
  if ((ls.fxDate || '') > (os.fxDate || '')){ os.fx = ls.fx; os.fxUsd = ls.fxUsd; os.fxDate = ls.fxDate; }
  os.deletedTx = [...deleted];
  return out;
}
async function loadEnc(pass){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const r = await fetch('data.enc', {cache: 'no-store'}); if (!r.ok) throw new Error('nofile');
  const e = await r.json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.trim()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64(e.iv)}, key, b64(e.ct));
  const d = JSON.parse(new TextDecoder().decode(plain));
  const hadData = !demo && S.settings && Object.values(S.months).some(a => a.length);
  if (hadData) lsSet('ntk-prev', JSON.stringify({savedAt: new Date().toISOString(), settings: S.settings, months: S.months}));   // one-step undo
  const merged = hadData ? mergeData(d, {settings: S.settings, months: S.months}) : d;
  demo = false;
  S.settings = Object.assign(defaultSettings(), merged.settings); S.months = merged.months || {};
  S.settings.syncedAt = e.savedAt || new Date().toISOString();
  migrateData();
  lsSet('ntk-pass', pass.trim());   // this device already holds the decrypted data, so remembering the key here adds nothing new
  persist('settings'); Object.keys(S.months).forEach(persistMonth);
  return Object.values(S.months).flat().length;
}

function readFile(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      // CSV: keep every cell as text so Australian dd/mm/yyyy dates aren't re-read as US mm/dd
      const isText = /\.(csv|txt)$/i.test(file.name);
      const wb = XLSX.read(new Uint8Array(r.result), isText ? {type:'array', raw:true, codepage:949} : {type:'array', cellDates:true, codepage:949});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
      let acct = $('#impAcct').value;
      if (acct === '__new'){
        const name = $('#impNewName').value.trim() || file.name.replace(/\.[^.]+$/, '');
        if (demo) leaveDemo();
        const a = {id: uid(), bank: $('#impNewCur').value === 'KRW' ? 'other' : 'cba', name, cur: $('#impNewCur').value, type: $('#impNewType').value, snaps: []};
        S.settings.accounts.push(a); persist('settings'); acct = a.id;
      }
      const holder = rows.slice(0, 15).find(r => /^(성명|예금주|고객명)$/.test(String(r[0]).trim()));
      if (holder && String(holder[1] || '').trim()){ const n = String(holder[1]).trim(); S.settings.ownerNames = [...new Set([...(S.settings.ownerNames || []), n])]; if (!demo) persist('settings'); }
      pendingImport = {name: file.name, acct, rows, map: detect(rows)};
      showPreview();
    } catch { $('#impPreview').innerHTML = `<p class="neg small" style="margin-top:12px">이 파일을 읽지 못했어요. 비밀번호가 걸린 엑셀(토스뱅크 등)은 엑셀·Numbers에서 한 번 열고 비밀번호 없이 다시 저장한 뒤 넣어 주세요.</p>`; }
  };
  r.readAsArrayBuffer(file);
}
const HD = {date:/거래\s*일|일시|일자|날짜|date/i, desc:/적요|내용|description|narration|details/i, memo:/메모|memo/i, out:/출금|찾으신|지급|withdraw|debit/i, inn:/입금|맡기신|deposit|credit/i, amt:/거래\s*금액|^금액|amount/i, bal:/잔액|balance/i};
function detect(rows){

    const r = rows[i].map(c => String(c).trim()); const find = re => r.findIndex(c => c && re.test(c));
    const date = find(HD.date), out = find(HD.out), inn = find(HD.inn), amt = find(HD.amt), bal = find(HD.bal);
    if (date >= 0 && (amt >= 0 || out >= 0 || inn >= 0)){
      const party = find(/보낸|받는|거래처|가맹점|기재/);
      let desc = party >= 0 ? party : find(HD.desc), memo = find(HD.memo);
      if (memo < 0 && party >= 0) memo = find(/적요|내용/);
      if (desc < 0) desc = memo;
      const kind = find(/^적요$|^거래\s*유형$|^구분$/);
      return {header: i, date, desc, memo: memo !== desc ? memo : -1, kind: kind !== desc ? kind : -1, out, inn, amt: (out >= 0 || inn >= 0) ? -1 : amt, bal};
    }
  }
  const r0 = rows[0] || [];
  if (r0.length >= 3 && parseDate(r0[0]) && !isNaN(parseNum(r0[1]))) return {header:-1, date:0, amt:1, desc:2, bal: r0.length > 3 ? 3 : -1, out:-1, inn:-1, memo:-1};
  return {header:0, date:0, desc:1, amt:2, bal:-1, out:-1, inn:-1, memo:-1};
}
function parseNum(v){ if (typeof v === 'number') return v; const s = String(v).replace(/[,\s원₩$A]/g, '').replace(/^\((.*)\)$/, '-$1'); return s === '' || s === '-' ? NaN : parseFloat(s); }
function parseDate(v){
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0,10);
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})[.\-/년\s]+(\d{1,2})[.\-/월\s]+(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if ((m = s.match(/^(\d{2})[.\-](\d{2})[.\-](\d{2})\b/))) return `20${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function parseRows(p){
  const {map, rows} = p, out = [];
  for (let i = map.header + 1; i < rows.length; i++){
    const r = rows[i]; if (!r || !r.length) continue;
    const date = parseDate(r[map.date]); if (!date) continue;
    let amt;
    if (map.amt >= 0) amt = parseNum(r[map.amt]);
    else { const o = map.out >= 0 ? parseNum(r[map.out]) : NaN, n = map.inn >= 0 ? parseNum(r[map.inn]) : NaN; amt = isNaN(o) && isNaN(n) ? NaN : (isNaN(n) ? 0 : n) - (isNaN(o) ? 0 : Math.abs(o)); }
    if (isNaN(amt) || amt === 0) continue;
    let desc = map.desc >= 0 ? String(r[map.desc]).trim() : '';
    if (!desc && map.kind >= 0) desc = String(r[map.kind]).trim();
    if (map.memo >= 0 && r[map.memo] && String(r[map.memo]).trim() !== desc) desc = (desc ? desc + ' · ' : '') + String(r[map.memo]).trim();
    const bal = map.bal >= 0 ? parseNum(r[map.bal]) : NaN;
    out.push({date, amt, desc: desc || '(내용 없음)', bal: isNaN(bal) ? undefined : bal});
  }
  if (out.length > 1 && out[0].date > out[out.length-1].date) out.reverse();
  out.forEach((t, i) => t.seq = i);
  return out;
}
function remap(){ const p = pendingImport; if (!p) return; document.querySelectorAll('[data-map]').forEach(s => p.map[s.dataset.map] = parseInt(s.value, 10)); showPreview(); }
const txKey = t => [t.acct, t.date, Number(t.amt).toFixed(2), t.bal != null ? Number(t.bal).toFixed(2) : '', String(t.desc).slice(0,40)].join('|');
function showPreview(){
  const p = pendingImport, box = $('#impPreview'); if (!box || !p) return;
  const parsed = parseRows(p), acct = acctById(p.acct), cur = acct ? acct.cur : 'AUD';
  const keys = new Set(demo ? [] : allTx().filter(t => t.acct === p.acct).map(txKey));
  const fresh = parsed.filter(t => !keys.has(txKey({...t, acct: p.acct}))); p.fresh = fresh;
  const hdr = p.map.header >= 0 ? p.rows[p.map.header] : (p.rows[0] || []).map((_, i) => `${i+1}번째 칸`);
  const sel = (k, label) => `<label class="f">${label}<select data-map="${k}"><option value="-1">없음</option>${hdr.map((h, i) => `<option value="${i}" ${p.map[k]===i?'selected':''}>${esc(String(h).slice(0,18) || (i+1)+'번째 칸')}</option>`).join('')}</select></label>`;
  box.innerHTML = `<div class="stack" style="margin-top:16px">
    <div class="row between"><b>${esc(p.name)}</b><span class="small muted">${parsed.length}건 읽음 · 새 거래 <b>${fresh.length}</b>건 · 이미 있는 ${parsed.length - fresh.length}건 건너뜀</span></div>
    <details><summary class="small">칸이 잘못 잡혔으면 여기서 고치기</summary><div class="row" style="margin-top:8px">${sel('date','날짜')}${sel('desc','내용')}${sel('memo','메모')}${sel('amt','금액(±)')}${sel('out','출금')}${sel('inn','입금')}${sel('bal','잔액')}</div></details>
    <div class="tablewrap"><table><thead><tr><th>날짜</th><th>내용</th><th>분류</th><th class="r">금액</th><th class="r">잔액</th></tr></thead>
      <tbody>${fresh.slice(-8).reverse().map(t => `<tr><td class="num small">${t.date}</td><td><span class="desc">${esc(t.desc)}</span></td><td class="small">${categorize(t.desc, t.amt, p.acct)}</td><td class="r num ${t.amt>0?'pos':''}">${fmt(t.amt, cur, {sign:true, noCents:cur==='KRW'})}</td><td class="r num small muted">${t.bal != null ? fmt(t.bal, cur, {noCents:cur==='KRW'}) : '—'}</td></tr>`).join('') || `<tr><td colspan="5" class="muted">새로 들어갈 거래가 없어요.</td></tr>`}</tbody></table></div>
    <div class="row"><button class="btn primary" data-impok="1" ${fresh.length ? '' : 'disabled'}>${acct ? esc(acct.name) : ''}에 ${fresh.length}건 넣기</button><button class="btn" data-impcancel="1">취소</button></div>
  </div>`;
}
function commitImport(){
  const p = pendingImport; if (!p || !p.fresh) return;
  if (demo) leaveDemo();
  if (!acctById(p.acct)){ const def = defaultSettings().accounts.find(a => a.id === p.acct); if (def) S.settings.accounts.push(def); else { toast('계좌를 먼저 추가해 주세요'); return; } }
  const touched = new Set();
  for (const t of p.fresh){ const m = monthOf(t.date); (S.months[m] ??= []).push({id: uid(), acct: p.acct, date: t.date, amt: t.amt, desc: t.desc, bal: t.bal, seq: t.seq, cat: categorize(t.desc, t.amt, p.acct)}); touched.add(m); }
  touched.forEach(persistMonth); persist('settings');
  const n = p.fresh.length; pendingImport = null; toast(`${n}건을 넣었어요`); go('home');
}

/* ================= boot ================= */
const saved = lsGet('ntk-tab'); if (saved && ['home','flow','subs','budget','plan'].includes(saved)) tab = saved;
loadDemo(); render();
initStore();
probeEnc();
})();
